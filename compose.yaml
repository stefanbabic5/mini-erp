# Local infrastructure for development: `docker compose up -d`
#
# The API itself runs on the host with `dotnet run` (see README). Values below have
# development defaults, so a fresh clone works without any setup; copy .env.example
# to .env to override them. Never use these defaults outside a developer machine.

name: mini-erp

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_erp}
      POSTGRES_USER: ${POSTGRES_USER:-mini_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_erp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider (OIDC). Imports deploy/keycloak/realm-mini-erp.json on start:
  # tenants Alfa and Beta, one user per role in each (password: dev-password).
  # Admin console: http://localhost:8080 (admin / admin). Development mode only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  # Receives logs, traces and metrics over OTLP and shows them in a web UI.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    environment:
      # Local development only: the UI opens without a login token.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888" # web UI: http://localhost:18888
      - "4317:18889"  # OTLP over gRPC, where the API sends its telemetry

volumes:
  postgres-data:
