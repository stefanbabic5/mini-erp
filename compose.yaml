# Local infrastructure for development: `docker compose up -d`
#
# The API itself runs on the host with `dotnet run` (see README). Values below have
# development defaults, so a fresh clone works without any setup; copy .env.example
# to .env to override them. Never use these defaults outside a developer machine.

name: mini-erp

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_erp}
      POSTGRES_USER: ${POSTGRES_USER:-mini_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_erp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Receives logs, traces and metrics over OTLP and shows them in a web UI.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    environment:
      # Local development only: the UI opens without a login token.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888" # web UI: http://localhost:18888
      - "4317:18889"  # OTLP over gRPC, where the API sends its telemetry

volumes:
  postgres-data:
